description: >-
  FinOps view of Wompi costs. Unlike metered API platforms, Wompi's cost is a
  per-successful-transaction commission (percentage + fixed COP fee + IVA/VAT)
  deducted from settlement, varying by payment method (CARD, PSE, NEQUI,
  Bancolombia). There is no per-API-call charge; the API itself is free with a
  merchant account. Cost management is about method mix, approval rates, and
  chargeback/void handling rather than token/request metering.
notes: >-
  Commission rates are set by the merchant's Wompi / Grupo Bancolombia
  agreement and settle in COP. Verify current per-method rates on the Wompi
  pricing page during reconciliation.
