meters:
- name: transaction_commission
  description: Per-successful-transaction commission (percentage + fixed COP fee + IVA), varying by payment method.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - payment_method
  - currency
- name: refunds_and_voids
  description: Voided/annulled card transactions and refunds that adjust settled amounts.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - payment_method
principles:
- name: Visibility
  description: Reconcile settlement reports by payment method; track effective take-rate (fees / gross volume).
- name: Allocation
  description: Tag transactions by merchant reference / storefront to map payment costs to products or channels.
- name: Optimization
  description: Steer customers toward lower-cost methods (PSE / Nequi vs. card) where appropriate; reduce declines to avoid retry cost and lost revenue.
- name: Accountability
  description: Review monthly commission and chargeback/void rates against budget and approval-rate targets.
