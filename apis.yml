aid: wompi
url: https://raw.githubusercontent.com/api-evangelist/wompi/refs/heads/main/apis.yml
name: Wompi
kind: company
description: Wompi is the payment gateway of Grupo Bancolombia, serving Colombia (COP).
  Its REST API creates and tracks transactions across local payment methods - CARD,
  NEQUI (mobile wallet), PSE (online bank debit), and Bancolombia Transfer / Collect
  - plus card and Nequi tokenization, reusable payment sources, and hosted payment
  links. Public-key endpoints are browser-safe; private-key endpoints are server-side.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/wompi.png
tags:
- Payments
- Fintech
- Colombia
- LatAm
- Payment Gateway
- PSE
